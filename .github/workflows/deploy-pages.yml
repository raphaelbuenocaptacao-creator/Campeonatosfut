name: Deploy Campeonato Foot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA files
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon-192.png -o -f icons/icon-192.svg
          test -f icons/icon-512.png -o -f icons/icon-512.svg
          grep -q '"name"' manifest.webmanifest
          grep -q '"short_name"' manifest.webmanifest
          grep -q '"start_url"' manifest.webmanifest
          grep -q '"display"' manifest.webmanifest
          grep -q '"theme_color"' manifest.webmanifest
          grep -q 'rel="manifest"' index.html
          grep -q 'theme-color' index.html
          grep -q 'serviceWorker' app.js
          grep -q 'register' app.js
          grep -q 'caches' sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
