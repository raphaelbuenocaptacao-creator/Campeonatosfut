name: Campeonatosfut PWA Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const sw = fs.readFileSync('sw.js', 'utf8');
          const reg = fs.readFileSync('pwa-install.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');

          for (const key of ['name','short_name','start_url','display','theme_color','background_color','icons']) {
            if (!manifest[key]) throw new Error(`manifest missing ${key}`);
          }
          if (manifest.display !== 'standalone') throw new Error('manifest display must be standalone');
          const icon192 = manifest.icons.find(i => i.sizes === '192x192' && i.type === 'image/png');
          const icon512 = manifest.icons.find(i => i.sizes === '512x512' && i.type === 'image/png' && (!i.purpose || i.purpose.includes('any')));
          const maskable = manifest.icons.find(i => i.sizes === '512x512' && i.type === 'image/png' && i.purpose?.includes('maskable'));
          if (!icon192 || !icon512 || !maskable) throw new Error('required 192/512/maskable icons missing');
          for (const icon of [icon192, icon512, maskable]) {
            if (!fs.existsSync(icon.src)) throw new Error(`icon file missing: ${icon.src}`);
          }

          const cacheMatch = sw.match(/const CACHE = `\$\{CACHE_PREFIX\}([^`]+)`/);
          if (!cacheMatch) throw new Error('service worker cache version missing');
          const swVersion = cacheMatch[1];
          const regMatch = reg.match(/const SW_VERSION = '([^']+)'/);
          if (!regMatch) throw new Error('service worker registration version missing');
          if (regMatch[1] !== swVersion) throw new Error(`SW version mismatch: ${regMatch[1]} != ${swVersion}`);
          if (!/updateViaCache:\s*'none'/.test(reg)) throw new Error('updateViaCache none missing');
          if (!/beforeinstallprompt/.test(reg)) throw new Error('install prompt support missing');
          if (!/visibilitychange/.test(reg) || !/visibilityState\s*===\s*'visible'/.test(reg) || !/registration\.update\(\)/.test(reg)) throw new Error('foreground SW update check missing');
          if (!/controllerchange/.test(reg) || !/hadController/.test(reg) || !/window\.location\.reload\(\)/.test(reg)) throw new Error('safe SW controller handoff missing');

          for (const token of ["request.headers.has('authorization')", "request.headers.has('cookie')", "request.headers.has('range')", "request.headers.has('if-range')", "response.status === 206", "response.headers.has('set-cookie')", "response.headers.has('content-range')"]) {
            if (!sw.includes(token)) throw new Error(`cache safety check missing: ${token}`);
          }
          if (!/key === 'range'/.test(sw) || !/key === 'if-range'/.test(sw)) throw new Error('Vary range/if-range protection missing');
          if (!/key\.startsWith\(CACHE_PREFIX\)/.test(sw)) throw new Error('cache cleanup must be app-prefixed');
          if (!/PRIVATE_PATH/.test(sw) || !/PRIVATE_QUERY/.test(sw)) throw new Error('private request exclusions missing');
          if (!/cache:\s*'no-store'/.test(sw)) throw new Error('navigation must use no-store');

          if (!/<meta[^>]+name=["']viewport["']/i.test(html)) throw new Error('viewport meta missing');
          if (!/<meta[^>]+name=["']theme-color["']/i.test(html)) throw new Error('theme-color meta missing');
          if (!/<link[^>]+rel=["']manifest["'][^>]+manifest\.webmanifest/i.test(html)) throw new Error('manifest link missing');
          NODE
      - name: Validate PNG dimensions
        shell: bash
        run: |
          set -euo pipefail
          file icons/icon-192.png | grep -Eq '192 x 192'
          file icons/icon-512.png | grep -Eq '512 x 512'
          file icons/icon-512-maskable.png | grep -Eq '512 x 512'
